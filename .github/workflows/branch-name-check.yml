name: Branch Name Check

on:
  push:
    branches-ignore:
      - 'main'
      - 'central'

permissions:
  contents: read

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name format
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "Branch name: $BRANCH"

          # Valid patterns
          if [[ "$BRANCH" =~ ^feature/[a-z0-9-]+$ ]] || \
             [[ "$BRANCH" =~ ^fix/[a-z0-9-]+$ ]] || \
             [[ "$BRANCH" =~ ^chore/[a-z0-9-]+$ ]] || \
             [[ "$BRANCH" =~ ^docs/[a-z0-9-]+$ ]]; then
            echo "✅ Branch name '$BRANCH' is valid"
            exit 0
          fi

          echo "❌ Branch '$BRANCH' violates naming convention"
          echo "Valid patterns:"
          echo "  feature/[a-z0-9-]+"
          echo "  fix/[a-z0-9-]+"
          echo "  chore/[a-z0-9-]+"
          echo "  docs/[a-z0-9-]+"
          exit 1

